<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Media Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <link rel="icon" href="images/favicon.png" type="image/png">

    <style>
        body { font-family: Arial, sans-serif; }
        h1 { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body>
    <h1>My Media Hub</h1>

    <h2>YouTube Video</h2>
    <iframe width="560" height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube video"
        allowfullscreen></iframe>

    <h2>Local Video</h2>
    <!-- Add video files in media/ using these names -->
    <video width="500" controls>
        <source src="media/my-video.mp4" type="video/mp4">
        <source src="media/my-video.webm" type="video/webm">
        Your browser does not support the video tag.
    </video>

    <h2>Audio</h2>
    <!-- Add an audio file as media/my-audio.mp3 -->
    <audio controls>
        <source src="media/my-audio.wav" type="audio/wav">
        Your browser does not support the audio tag.
    </audio>

    <h2>PCPS College Location</h2>
    <iframe
        src="https://www.google.com/maps?q=PCPS%20College%20Kupondole%20Lalitpur&output=embed"
        width="600" height="350" style="border:0;" loading="lazy">
    </iframe>

    <h2>External Webpage</h2>
    <iframe src="https://example.com" width="600" height="300" title="External webpage"></iframe>

    <h2>PDF Document</h2>
    <!-- Add a PDF as media/sample.pdf -->
    <embed src="media/sample.pdf" type="application/pdf" width="600" height="500">
</body>
</html>
